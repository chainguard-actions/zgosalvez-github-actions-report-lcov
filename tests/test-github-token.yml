name: Test github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov
          which genhtml
          which lcov
          lcov --version

      - id: action
        uses: .
        with:
          coverage-files: ${{ github.workspace }}/hardened/tests/fixtures/lcov.info
          working-directory: ${{ github.workspace }}/hardened/tests/fixtures
          github-token: ${{ github.token }}
          genhtml-ignore-errors: source

      - name: Assert action succeeded with github-token input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "total-coverage: $TOTAL"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when github-token is provided"
            exit 1
          fi
          if [ -z "$TOTAL" ]; then
            echo "FAIL: total-coverage output is empty"
            exit 1
          fi
          if ! echo "$TOTAL" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: total-coverage is not a numeric value: $TOTAL"
            exit 1
          fi
          echo "PASS: action succeeded with github-token, total-coverage=$TOTAL"
