name: Test LCOV reporting with github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lcov

      - name: Create source directory and LCOV coverage file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          printf 'function hello() { return "hello"; }\n' > "$GITHUB_WORKSPACE/src/index.js"
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          cp tests/fixtures/lcov-full.info "$GITHUB_WORKSPACE/coverage/lcov.info"

      - id: action
        uses: .
        with:
          coverage-files: coverage/lcov.info
          github-token: ${{ github.token }}
          working-directory: ${{ github.workspace }}
          genhtml-ignore-errors: source

      - name: Assert total-coverage output is set
        env:
          TOTAL_COVERAGE: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "total-coverage: $TOTAL_COVERAGE"
          if [ -z "$TOTAL_COVERAGE" ]; then
            echo "FAIL: expected total-coverage to be non-empty"
            exit 1
          fi
          echo "PASS: total-coverage=$TOTAL_COVERAGE"

      - name: Assert total-coverage is numeric
        env:
          TOTAL_COVERAGE: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "total-coverage: $TOTAL_COVERAGE"
          if ! echo "$TOTAL_COVERAGE" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: total-coverage is not a numeric value: $TOTAL_COVERAGE"
            exit 1
          fi
          echo "PASS: total-coverage is numeric"
