name: Test LCOV with artifact-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov

      - name: Create LCOV coverage file
        run: |
          mkdir -p /tmp/coverage
          printf 'TN:\nSF:src/index.js\nFN:1,main\nFNDA:1,main\nFNF:1\nFNH:1\nDA:1,1\nDA:2,1\nDA:3,1\nDA:4,1\nLF:4\nLH:4\nend_of_record\n' > /tmp/coverage/lcov.info

      - id: action
        uses: .
        continue-on-error: true
        with:
          coverage-files: /tmp/coverage/lcov.info
          minimum-coverage: 0
          genhtml-ignore-errors: source
          artifact-name: code-coverage-report

      - name: Assert action ran with artifact-name input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COVERAGE: ${{ steps.action.outputs.total-coverage }}
          ARTIFACT_ID: ${{ steps.action.outputs.artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total-coverage: $COVERAGE"
          echo "artifact-id: $ARTIFACT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COVERAGE" ]; then
              echo "FAIL: action succeeded but total-coverage output is empty"
              exit 1
            fi
            echo "PASS: total-coverage=$COVERAGE artifact-id=$ARTIFACT_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (artifact upload may not work in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
