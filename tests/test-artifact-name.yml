name: Test artifact-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lcov

      - id: action
        uses: .
        continue-on-error: true
        with:
          coverage-files: tests/fixtures/lcov-full.info
          minimum-coverage: 0
          working-directory: tests/fixtures
          artifact-name: code-coverage-report

      - name: Assert action ran (coverage reported or failed gracefully on sentinel repo)
        env:
          TOTAL: ${{ steps.action.outputs.total-coverage }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total-coverage: $TOTAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOTAL" ]; then
              echo "FAIL: action succeeded but total-coverage output is empty"
              exit 1
            fi
            echo "PASS: got total-coverage '$TOTAL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (artifact upload may fail on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
