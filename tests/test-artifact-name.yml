name: Test LCOV reporting with artifact upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lcov

      - name: Set up source files and coverage data
        run: |
          mkdir -p src coverage
          printf 'function example() {\n  var a = 1;\n  return a;\n}\n' > src/example.js
          cp tests/fixtures/lcov-full.info coverage/lcov.info

      - id: action
        uses: .
        with:
          coverage-files: coverage/lcov.info
          working-directory: ${{ github.workspace }}
          genhtml-ignore-errors: source
          artifact-name: code-coverage-report

      - name: Assert total-coverage output is set
        env:
          ACTUAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "actual total-coverage: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: total-coverage output is empty"
            exit 1
          fi
          echo "PASS: total-coverage=$ACTUAL"

      - name: Assert artifact-id output is set
        env:
          ACTUAL: ${{ steps.action.outputs.artifact-id }}
        run: |
          echo "actual artifact-id: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: artifact-id output is empty when artifact-name was provided"
            exit 1
          fi
          echo "PASS: artifact-id=$ACTUAL"
