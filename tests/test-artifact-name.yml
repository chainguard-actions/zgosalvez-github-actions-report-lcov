name: Test artifact-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov

      - name: Create source file referenced in LCOV
        run: |
          mkdir -p src
          printf 'function example() { return 1; }\n' > src/example.js

      - id: action
        uses: .
        continue-on-error: true
        with:
          coverage-files: tests/fixtures/lcov-100.info
          artifact-name: code-coverage-report
          # No github-token: skips PR comment

      - name: Assert action ran (coverage computed, or failed gracefully on artifact upload)
        env:
          TOTAL: ${{ steps.action.outputs.total-coverage }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total-coverage: $TOTAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOTAL" ]; then
              echo "FAIL: action succeeded but total-coverage output is empty"
              exit 1
            fi
            if ! echo "$TOTAL" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
              echo "FAIL: total-coverage is not numeric: $TOTAL"
              exit 1
            fi
            echo "PASS: action succeeded with artifact-name, total-coverage=$TOTAL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (artifact upload may fail in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
