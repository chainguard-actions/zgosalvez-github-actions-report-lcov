name: Test artifact-name input (HTML report upload)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov
          which genhtml
          which lcov
          lcov --version

      - id: action
        uses: .
        with:
          coverage-files: ${{ github.workspace }}/hardened/tests/fixtures/lcov.info
          working-directory: ${{ github.workspace }}/hardened/tests/fixtures
          artifact-name: code-coverage-report-test
          genhtml-ignore-errors: source
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert total-coverage output is set
        env:
          TOTAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "total-coverage: $TOTAL"
          if [ -z "$TOTAL" ]; then
            echo "FAIL: total-coverage output is empty"
            exit 1
          fi
          if ! echo "$TOTAL" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: total-coverage is not a numeric value: $TOTAL"
            exit 1
          fi
          echo "PASS: total-coverage=$TOTAL"

      - name: Assert artifact-id output is set when artifact-name is provided
        env:
          ARTIFACT_ID: ${{ steps.action.outputs.artifact-id }}
        run: |
          echo "artifact-id: $ARTIFACT_ID"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "FAIL: artifact-id output is empty — expected it to be set when artifact-name is provided"
            exit 1
          fi
          echo "PASS: artifact-id=$ARTIFACT_ID"
