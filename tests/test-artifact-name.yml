name: Test artifact-name upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure lcov/genhtml are installed
        run: |
          if ! command -v genhtml >/dev/null 2>&1 || ! command -v lcov >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
            $SUDO apt-get update
            $SUDO apt-get install -y lcov
          fi
          lcov --version
      - name: Verify fixture is present
        run: test -f "$GITHUB_WORKSPACE/tests/fixtures/tracefiles/math/lcov.info"
      # Artifact upload needs the Actions artifact service (ACTIONS_RUNTIME_TOKEN /
      # ACTIONS_RESULTS_URL), which may not be available under act. Accept either a
      # successful upload or a failure at the upload stage.
      - id: action
        uses: .
        continue-on-error: true
        with:
          coverage-files: ${{ github.workspace }}/tests/fixtures/tracefiles/math/lcov.info
          working-directory: tests/fixtures/src
          artifact-name: code-coverage-report
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL: ${{ steps.action.outputs.total-coverage }}
          ARTIFACT_ID: ${{ steps.action.outputs.artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total-coverage: $TOTAL"
          echo "artifact-id: '$ARTIFACT_ID'"
          if [ "$OUTCOME" = "success" ]; then
            if ! awk -v v="$TOTAL" 'BEGIN { d = v - 75; if (d < 0) d = -d; exit !(d < 0.01) }'; then
              echo "FAIL: expected total-coverage 75"
              exit 1
            fi
            # artifact-id is only set on PR events with a token; not here.
            if [ -n "$ARTIFACT_ID" ]; then
              echo "FAIL: artifact-id should be empty for non-PR event"
              exit 1
            fi
            echo "PASS: artifact uploaded and coverage reported"
          elif [ "$OUTCOME" = "failure" ]; then
            # Upload happens before total-coverage is set, so a failure at the upload
            # stage leaves total-coverage empty.
            if [ -n "$TOTAL" ]; then
              echo "FAIL: action failed after computing coverage (not an upload failure)"
              exit 1
            fi
            echo "PASS: action failed at artifact upload (no artifact service under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
