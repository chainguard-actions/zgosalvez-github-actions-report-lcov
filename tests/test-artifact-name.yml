name: Test LCOV reporting with artifact-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lcov

      - name: Create source directory and LCOV coverage file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          printf 'function hello() { return "hello"; }\n' > "$GITHUB_WORKSPACE/src/index.js"
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          cp tests/fixtures/lcov-full.info "$GITHUB_WORKSPACE/coverage/lcov.info"

      - id: action
        uses: .
        continue-on-error: true
        with:
          coverage-files: coverage/lcov.info
          artifact-name: code-coverage-report
          working-directory: ${{ github.workspace }}
          genhtml-ignore-errors: source

      - name: Assert action ran (coverage reported or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL_COVERAGE: ${{ steps.action.outputs.total-coverage }}
          ARTIFACT_ID: ${{ steps.action.outputs.artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total-coverage: $TOTAL_COVERAGE"
          echo "artifact-id: $ARTIFACT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOTAL_COVERAGE" ]; then
              echo "FAIL: action succeeded but total-coverage output is empty"
              exit 1
            fi
            echo "PASS: total-coverage=$TOTAL_COVERAGE artifact-id=$ARTIFACT_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for artifact upload)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
