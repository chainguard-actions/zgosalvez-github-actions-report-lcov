name: Test artifact-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov
          lcov --version

      - id: action
        uses: .
        continue-on-error: true
        with:
          coverage-files: ${{ github.workspace }}/tests/fixtures/lcov-full.info
          working-directory: ${{ github.workspace }}/tests/fixtures
          artifact-name: code-coverage-report

      - name: Assert action ran and total-coverage is set or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total-coverage: $TOTAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOTAL" ]; then
              echo "FAIL: action succeeded but total-coverage output is empty"
              exit 1
            fi
            echo "PASS: total-coverage is '$TOTAL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo artifact upload not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
