name: Test artifact-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock lcov tools
        run: |
          mkdir -p /tmp/mock-bin

          # Mock genhtml: creates the output directory with a minimal HTML file
          printf '%s\n' '#!/bin/sh' \
            'outdir=""' \
            'prev=""' \
            'for arg in "$@"; do' \
            '  case "$prev" in' \
            '    --output-directory) outdir="$arg" ;;' \
            '  esac' \
            '  prev="$arg"' \
            'done' \
            'if [ -n "$outdir" ]; then' \
            '  mkdir -p "$outdir"' \
            '  printf "<html><body>Coverage</body></html>" > "$outdir/index.html"' \
            'fi' \
            'echo "genhtml: done"' \
            'exit 0' > /tmp/mock-bin/genhtml
          chmod +x /tmp/mock-bin/genhtml

          # Mock lcov: merges tracefiles by concatenation
          printf '%s\n' '#!/bin/sh' \
            'outfile=""' \
            'tracefiles=""' \
            'prev=""' \
            'for arg in "$@"; do' \
            '  case "$prev" in' \
            '    --output-file) outfile="$arg" ;;' \
            '    --add-tracefile) tracefiles="$tracefiles $arg" ;;' \
            '  esac' \
            '  prev="$arg"' \
            'done' \
            'if [ -n "$outfile" ]; then' \
            '  : > "$outfile"' \
            '  for tf in $tracefiles; do' \
            '    cat "$tf" >> "$outfile"' \
            '  done' \
            'fi' \
            'exit 0' > /tmp/mock-bin/lcov
          chmod +x /tmp/mock-bin/lcov

          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          coverage-files: tests/fixtures/lcov-full.info
          working-directory: tests/fixtures
          artifact-name: code-coverage-report
          github-token: ${{ github.token }}

      - name: Assert action ran (coverage computed or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COVERAGE: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total-coverage: $COVERAGE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COVERAGE" ]; then
              echo "FAIL: action succeeded but total-coverage output is empty"
              exit 1
            fi
            if ! echo "$COVERAGE" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
              echo "FAIL: total-coverage is not a number: $COVERAGE"
              exit 1
            fi
            echo "PASS: total-coverage=$COVERAGE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / artifact API not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
