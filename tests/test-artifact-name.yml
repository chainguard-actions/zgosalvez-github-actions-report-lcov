name: Test artifact-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lcov

      - id: action
        uses: .
        continue-on-error: true
        with:
          coverage-files: tests/fixtures/lcov-full.info
          minimum-coverage: 0
          working-directory: tests/fixtures
          artifact-name: code-coverage-report

      - name: Assert action ran (artifact upload or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL: ${{ steps.action.outputs.total-coverage }}
          ARTIFACT_ID: ${{ steps.action.outputs.artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total-coverage: $TOTAL"
          echo "artifact-id: $ARTIFACT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOTAL" ]; then
              echo "FAIL: action succeeded but total-coverage output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with total-coverage='$TOTAL' artifact-id='$ARTIFACT_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for artifact upload)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
