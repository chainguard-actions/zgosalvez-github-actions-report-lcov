name: Test artifact-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov

      - id: action
        uses: .
        continue-on-error: true
        with:
          coverage-files: ${{ github.workspace }}/hardened/tests/fixtures/lcov.info
          working-directory: ${{ github.workspace }}/hardened/tests/fixtures
          artifact-name: code-coverage-report
          genhtml-ignore-errors: source

      - name: Assert action ran (artifact upload may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL: ${{ steps.action.outputs.total-coverage }}
          ARTIFACT_ID: ${{ steps.action.outputs.artifact-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total-coverage: $TOTAL"
          echo "artifact-id: $ARTIFACT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOTAL" ]; then
              echo "FAIL: action succeeded but total-coverage output is empty"
              exit 1
            fi
            if ! echo "$TOTAL" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
              echo "FAIL: total-coverage is not a numeric value: $TOTAL"
              exit 1
            fi
            echo "PASS: action succeeded with artifact-name, total-coverage=$TOTAL, artifact-id=$ARTIFACT_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (artifact upload not available on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
