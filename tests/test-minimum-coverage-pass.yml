name: Test minimum coverage pass
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lcov
          lcov --version
          genhtml --version

      - name: Set up source files and coverage data
        run: |
          mkdir -p src coverage
          printf 'function example() {\n  var a = 1;\n  var b = 2;\n  return a + b;\n}\n' > src/example.js
          cp tests/fixtures/lcov-full.info coverage/lcov.info

      - id: action
        uses: .
        with:
          coverage-files: coverage/lcov.info
          minimum-coverage: 50
          working-directory: ${{ github.workspace }}
          genhtml-ignore-errors: source

      - name: Assert action passed and total-coverage is at least 50
        env:
          ACTUAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "actual total-coverage: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: total-coverage output is empty"
            exit 1
          fi
          # Check it's a number >= 50
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: total-coverage is not numeric: $ACTUAL"
            exit 1
          fi
          INT_VAL=$(echo "$ACTUAL" | cut -d. -f1)
          if [ "$INT_VAL" -lt 50 ]; then
            echo "FAIL: total-coverage $ACTUAL is less than 50"
            exit 1
          fi
          echo "PASS: total-coverage=$ACTUAL meets minimum of 50"
