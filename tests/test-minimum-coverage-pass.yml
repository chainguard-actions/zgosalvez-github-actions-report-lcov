name: Test minimum coverage - passes when coverage meets threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov

      - name: Create source file referenced in LCOV
        run: |
          mkdir -p src
          printf 'function example() { return 1; }\n' > src/example.js

      - id: action
        uses: .
        with:
          coverage-files: tests/fixtures/lcov-100.info
          minimum-coverage: 90

      - name: Assert action passed with coverage above minimum
        env:
          TOTAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "total-coverage: $TOTAL"
          if [ -z "$TOTAL" ]; then
            echo "FAIL: total-coverage output is empty"
            exit 1
          fi
          # Coverage should be 100 (all lines hit), which is >= 90
          if ! echo "$TOTAL" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: total-coverage is not numeric: $TOTAL"
            exit 1
          fi
          echo "PASS: action passed with total-coverage=$TOTAL (minimum was 90)"
