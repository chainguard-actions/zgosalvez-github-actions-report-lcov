name: Test minimum coverage not reached
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure lcov/genhtml are installed
        run: |
          if ! command -v genhtml >/dev/null 2>&1 || ! command -v lcov >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
            $SUDO apt-get update
            $SUDO apt-get install -y lcov
          fi
          lcov --version
      - name: Verify fixture is present
        run: test -f "$GITHUB_WORKSPACE/tests/fixtures/tracefiles/math/lcov.info"
      - id: action
        uses: .
        continue-on-error: true
        with:
          coverage-files: ${{ github.workspace }}/tests/fixtures/tracefiles/math/lcov.info
          working-directory: tests/fixtures/src
          minimum-coverage: 90
      - name: Assert action failed but still reported coverage
        env:
          ACTUAL: ${{ steps.action.outputs.total-coverage }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because 75 < 90"
            exit 1
          fi
          if ! awk -v v="$ACTUAL" 'BEGIN { d = v - 75; if (d < 0) d = -d; exit !(d < 0.01) }'; then
            echo "FAIL: expected total-coverage 75 to be set before failing"
            exit 1
          fi
          echo "PASS"
