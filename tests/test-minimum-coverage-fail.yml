name: Test minimum coverage threshold fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov

      - name: Create partial LCOV fixture with absolute source path
        run: |
          SRC="$GITHUB_WORKSPACE/tests/fixtures/src/example.js"
          printf 'TN:\nSF:%s\nFN:1,example\nFNDA:1,example\nFNF:1\nFNH:1\nDA:1,1\nDA:2,0\nDA:3,0\nDA:4,1\nLF:4\nLH:2\nend_of_record\n' "$SRC" \
            > "$GITHUB_WORKSPACE/tests/fixtures/lcov-partial-abs.info"

      # Partial coverage fixture has 50% coverage; set minimum to 90 so it fails
      - id: action
        uses: .
        continue-on-error: true
        with:
          coverage-files: tests/fixtures/lcov-partial-abs.info
          minimum-coverage: 90
          genhtml-ignore-errors: source

      - name: Assert action failed due to low coverage
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total-coverage: $TOTAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when coverage ($TOTAL) is below minimum (90), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when coverage was below minimum threshold"
