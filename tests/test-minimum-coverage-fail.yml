name: Test minimum coverage threshold fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov
          lcov --version

      # Partial coverage LCOV has 50% line coverage; minimum is set to 95
      # The action should fail because coverage is below the minimum
      - id: action
        uses: .
        continue-on-error: true
        with:
          coverage-files: ${{ github.workspace }}/tests/fixtures/lcov-partial.info
          minimum-coverage: 95
          working-directory: ${{ github.workspace }}/tests/fixtures

      - name: Assert action failed due to low coverage
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total-coverage: $TOTAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when coverage ($TOTAL) is below minimum (95), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when coverage is below minimum threshold"
