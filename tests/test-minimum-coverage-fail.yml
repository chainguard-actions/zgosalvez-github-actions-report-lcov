name: Test minimum coverage fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lcov
          lcov --version
          genhtml --version

      - name: Set up source files and coverage data
        run: |
          mkdir -p src coverage
          printf 'function example() {\n  var a = 1;\n  var b = 2;\n  return a + b;\n}\n' > src/example.js
          cp tests/fixtures/lcov-partial.info coverage/lcov.info

      # The action should fail because coverage (50%) is below minimum (90%)
      - id: action
        uses: .
        continue-on-error: true
        with:
          coverage-files: coverage/lcov.info
          minimum-coverage: 90
          working-directory: ${{ github.workspace }}
          genhtml-ignore-errors: source

      - name: Assert action failed due to low coverage
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual total-coverage: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when coverage is below minimum, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when coverage was below minimum"

      - name: Assert total-coverage output is still set even on failure
        env:
          ACTUAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "actual total-coverage: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: total-coverage output should be set even when minimum is not reached"
            exit 1
          fi
          echo "PASS: total-coverage=$ACTUAL is set"
