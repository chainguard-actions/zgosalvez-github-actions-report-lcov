name: Test working-directory input - specify source file location
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov

      - name: Create source files in a custom working directory
        run: |
          mkdir -p myproject/src
          printf 'function example() { return 1; }\n' > myproject/src/example.js

      - name: Create LCOV file referencing source relative to working-directory
        run: |
          cat > /tmp/lcov-workdir.info << 'EOF'
          TN:
          SF:src/example.js
          FN:1,example
          FNDA:1,example
          FNF:1
          FNH:1
          DA:1,1
          DA:2,1
          DA:3,1
          LF:3
          LH:3
          end_of_record
          EOF

      - id: action
        uses: .
        with:
          coverage-files: /tmp/lcov-workdir.info
          working-directory: myproject

      - name: Assert total-coverage output is set
        env:
          TOTAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "total-coverage: $TOTAL"
          if [ -z "$TOTAL" ]; then
            echo "FAIL: total-coverage output is empty"
            exit 1
          fi
          if ! echo "$TOTAL" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: total-coverage is not numeric: $TOTAL"
            exit 1
          fi
          echo "PASS: action completed with working-directory, total-coverage=$TOTAL"
