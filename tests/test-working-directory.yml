name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov

      - id: action
        uses: .
        with:
          coverage-files: tests/fixtures/lcov-subdir.info
          working-directory: tests/fixtures/src
          # No github-token: skips PR comment
          # No minimum-coverage: defaults to 0 (always passes)

      - name: Assert total-coverage output is set
        env:
          TOTAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "total-coverage: $TOTAL"
          if [ -z "$TOTAL" ]; then
            echo "FAIL: total-coverage output is empty"
            exit 1
          fi
          if ! echo "$TOTAL" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: total-coverage is not numeric: $TOTAL"
            exit 1
          fi
          echo "PASS: action completed with working-directory, total-coverage=$TOTAL"
