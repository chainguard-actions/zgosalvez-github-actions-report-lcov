name: Test basic LCOV coverage report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '24'

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov
          which genhtml
          which lcov
          lcov --version

      - id: action
        uses: .
        with:
          coverage-files: ${{ github.workspace }}/tests/fixtures/lcov.info
          working-directory: ${{ github.workspace }}/tests/fixtures
          genhtml-ignore-errors: source

      - name: Assert total-coverage output is set
        env:
          TOTAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "total-coverage: $TOTAL"
          if [ -z "$TOTAL" ]; then
            echo "FAIL: total-coverage output is empty"
            exit 1
          fi
          # Verify it's a numeric value (integer or float)
          if ! echo "$TOTAL" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: total-coverage is not a numeric value: $TOTAL"
            exit 1
          fi
          echo "PASS: total-coverage=$TOTAL"
