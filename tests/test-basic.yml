name: Test basic LCOV coverage reporting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lcov
          lcov --version
          genhtml --version

      - name: Set up source files and coverage data
        run: |
          mkdir -p src coverage
          printf 'function example() {\n  var a = 1;\n  var b = 2;\n  return a + b;\n}\n' > src/example.js
          cp tests/fixtures/lcov-full.info coverage/lcov.info

      - id: action
        uses: .
        with:
          coverage-files: coverage/lcov.info
          working-directory: ${{ github.workspace }}
          genhtml-ignore-errors: source

      - name: Assert total-coverage output is set
        env:
          ACTUAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "actual total-coverage: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: total-coverage output is empty"
            exit 1
          fi
          echo "PASS: total-coverage=$ACTUAL"

      - name: Assert total-coverage is a number
        env:
          ACTUAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: total-coverage is not a numeric value: $ACTUAL"
            exit 1
          fi
          echo "PASS: total-coverage is numeric"
