name: Test title-prefix and additional-message inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov
          lcov --version

      # title-prefix and additional-message are only used in PR comments.
      # Under workflow_dispatch (non-PR), the action skips commenting but
      # still computes and outputs total-coverage.
      - id: action
        uses: .
        with:
          coverage-files: ${{ github.workspace }}/tests/fixtures/lcov-full.info
          title-prefix: "MyProject"
          additional-message: "See dashboard for details."
          minimum-coverage: 0
          working-directory: ${{ github.workspace }}/tests/fixtures

      - name: Assert total-coverage output is set
        env:
          TOTAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "total-coverage: $TOTAL"
          if [ -z "$TOTAL" ]; then
            echo "FAIL: total-coverage output is empty"
            exit 1
          fi
          if ! echo "$TOTAL" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: total-coverage '$TOTAL' is not a valid number"
            exit 1
          fi
          echo "PASS: action succeeded with title-prefix and additional-message inputs"
