name: Test title-prefix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install lcov
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lcov

      # Test that the action runs successfully with a title-prefix set.
      # Since this is workflow_dispatch (not a PR), no comment is posted.
      - id: action
        uses: .
        with:
          coverage-files: tests/fixtures/lcov-full.info
          minimum-coverage: 0
          title-prefix: "MyProject"
          working-directory: tests/fixtures

      - name: Assert total-coverage output is set
        env:
          TOTAL: ${{ steps.action.outputs.total-coverage }}
        run: |
          echo "total-coverage: $TOTAL"
          if [ -z "$TOTAL" ]; then
            echo "FAIL: total-coverage output is empty"
            exit 1
          fi
          if ! echo "$TOTAL" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: total-coverage '$TOTAL' is not a valid number"
            exit 1
          fi
          echo "PASS: total-coverage is '$TOTAL' with title-prefix set"
